[tool.setuptools]
package-dir = { "ovos-mac" = "ovos_mac" }
packages = ["ovos_mac"]
include-package-data = true

[dependency-groups]
mike = [
    "neon-homeassistant-skill>=0.0.22",
    "ovos-phal-plugin-homeassistant==0.0.4a15",
    "skill-plex",
]

